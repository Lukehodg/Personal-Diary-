name: iOS TestFlight

# Builds the iOS app on a macOS runner and uploads it to TestFlight, so the
# app can be installed on a phone without owning a Mac.
#
# Triggered by hand — macOS runners bill at 10x minutes, so this deliberately
# does not run on every push.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's in this build (shown in TestFlight)"
        required: false
        default: "Latest changes from main"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    env:
      # Must match PRODUCT_BUNDLE_IDENTIFIER in the Xcode project and the app
      # record in App Store Connect.
      BUNDLE_ID: com.lukehodg.workoutdiary
      SCHEME: App
      PROJECT: ios/App/App.xcodeproj

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the web app
        run: |
          npm ci
          npm run build

      - name: Copy the build into the iOS project
        run: npx cap sync ios

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Secrets pasted from a browser routinely pick up a trailing newline,
          # and a .p8 copied on Windows arrives with CRLF line endings. Both
          # break things further down — an unquoted redirect target with
          # whitespace is an "ambiguous redirect", and CRLF fails the PEM
          # parse. Normalise here rather than trusting a clean paste.
          KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          ISSUER_ID="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          TEAM_ID="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')"

          missing=""
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$ASC_PRIVATE_KEY" ] || missing="$missing ASC_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see the iOS section of the README."
            exit 1
          fi

          KEY_DIR="$HOME/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" | tr -d '\r' | sed -e '/^[[:space:]]*$/d' > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"; then
            echo "::error::ASC_PRIVATE_KEY doesn't look like a .p8 file. Paste the whole file, including the -----BEGIN PRIVATE KEY----- and -----END PRIVATE KEY----- lines."
            exit 1
          fi

          # Hand the cleaned values to the later steps.
          {
            echo "KEY_ID=$KEY_ID"
            echo "ISSUER_ID=$ISSUER_ID"
            echo "TEAM_ID=$TEAM_ID"
            echo "KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"
          echo "API key installed for team $TEAM_ID"

      - name: Verify the API key can authenticate
        # xcodebuild's own error for a rejected key is a bare 401 on an
        # internal endpoint with no explanation, which is exactly what
        # happened the first time this pipeline reached a real archive.
        # Calling Apple's API directly first gets their actual JSON error
        # back, which distinguishes "wrong credentials" from "right
        # credentials, missing permissions" — two problems that otherwise
        # look identical.
        run: |
          # macos-15's system Python refuses a bare `pip install` (PEP 668,
          # "externally managed environment") — needs its own venv rather
          # than --break-system-packages touching the runner's Python.
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          source "$RUNNER_TEMP/asc-venv/bin/activate"
          pip install --quiet --disable-pip-version-check pyjwt cryptography
          python3 ios/verify_asc_key.py

      - name: Archive
        run: |
          # CURRENT_PROJECT_VERSION comes from the run number: TestFlight
          # rejects a build number it has already accepted, and run numbers
          # only ever go up.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export the IPA
        run: |
          # teamID is injected here rather than committed to the repository.
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        run: |
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa was produced by the export step."
            exit 1
          fi
          echo "Uploading $(basename "$IPA")"
          # altool looks for keys in this directory by convention.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Keep the IPA as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Remove the signing key
        if: always()
        run: rm -rf ~/private_keys ~/.appstoreconnect/private_keys
